info:
  name: self-onboarding
  type: http
  seq: 3
http:
  method: POST
  url: '{{albBaseUrl}}/usermanagement/api/account/{{ACCOUNT_ID}}/self-onboarding'
  params:
  - name: api-version
    value: '8.12'
    type: query
  headers:
  - name: Content-Type
    value: application/json
  - name: Accept
    value: application/json
  body: {"apb":"{{APB}}"}
  auth: bearer
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
docs: |-
  Links the account to one pharmacy, the same flow the app runs when a pharmacy is selected. A 200 answer means the link is active right away, a 202 answer means the pharmacy still has to accept it.

  Mirrors FarmadClient::async_link_pharmacy.
